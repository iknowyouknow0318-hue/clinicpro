# ============================================================
# ClinicFlow AI — Application Configuration
# ============================================================

spring.application.name=ClinicFlow-AI

# ---- Database (H2 for development, switch to MySQL for production) ----
spring.datasource.url=jdbc:h2:mem:clinicflow_db;DB_CLOSE_DELAY=-1;MODE=MYSQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- MySQL (uncomment for production) ----
# spring.datasource.url=jdbc:mysql://localhost:3306/clinicflow_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=your_password_here

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- Server ----
server.port=8080

# ---- JWT Configuration ----
app.jwt.secret=ClinicFlowAI_SuperSecretKey_2026_ChangeThisInProduction_AtLeast256BitsLong!!
app.jwt.expiration-ms=86400000

# ---- CORS ----
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ---- Logging ----
logging.level.com.clinicflow=DEBUG
logging.level.org.springframework.security=DEBUG

